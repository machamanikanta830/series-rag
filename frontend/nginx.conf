server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Multipart overhead is handled here; FastAPI remains authoritative at 1 MB.
    client_max_body_size 2m;

    # The production Vite build uses /api so browser-visible URLs stay same-origin.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router routes fall back to the built application entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
