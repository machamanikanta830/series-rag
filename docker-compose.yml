services:
  qdrant:
    image: qdrant/qdrant:v1.18.0-unprivileged
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SERIESRAG_EMBEDDING_PROVIDER: sentence_transformer
      SERIESRAG_EMBEDDING_MODEL: ${SERIESRAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      SERIESRAG_VECTOR_STORE: qdrant
      SERIESRAG_QDRANT_URL: http://qdrant:6333
      SERIESRAG_QDRANT_COLLECTION: ${SERIESRAG_QDRANT_COLLECTION:-seriesrag}
      SERIESRAG_GENERATION_PROVIDER: ${SERIESRAG_GENERATION_PROVIDER:-fake}
      SERIESRAG_OLLAMA_URL: ${SERIESRAG_OLLAMA_URL:-http://host.docker.internal:11434}
      SERIESRAG_OLLAMA_MODEL: ${SERIESRAG_OLLAMA_MODEL:-}
      SERIESRAG_CONTEXT_MAX_CHARACTERS: ${SERIESRAG_CONTEXT_MAX_CHARACTERS:-4000}
      SERIESRAG_DEFAULT_TOP_K: ${SERIESRAG_DEFAULT_TOP_K:-5}
      HF_HOME: /home/seriesrag/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - huggingface_cache:/home/seriesrag/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 5m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qdrant_storage:
  huggingface_cache:
